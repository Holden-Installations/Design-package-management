<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Holden Design</title>

    <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.9/dist/main.js"></script>

    <style>
      @font-face {
        font-family: "Geist";
        src: url("https://cdn.jsdelivr.net/npm/geist@1.7.2/dist/fonts/geist-sans/Geist-Variable.woff2")
          format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      :root {
        --navy: #071827;
        --brand-blue: #0099e1;

        --bg: #f5f7f9;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --surface-hover: #f2f7fa;
        --surface-active: #eef8fd;

        --text: #17202a;
        --text-muted: #64748b;
        --text-soft: #475569;
        --header-text: #ffffff;
        --header-muted: #bfd0dc;
        --header-hover: #102b40;

        --border: #dce3ea;
        --border-strong: #c8d3dc;
        --focus-ring: rgba(0, 153, 225, 0.22);

        --warning-bg: #fff7e6;
        --warning-border: #f2cf83;
        --warning-text: #704600;

        --danger: #b42318;
        --mark-bg: #fff2b8;

        --status-green: #00c875;
        --status-green-text: #073b24;
        --status-amber: #fdab3d;
        --status-amber-text: #3d2a05;
        --status-red: #df2f4a;
        --status-red-text: #ffffff;
        --status-blue: #579bfc;
        --status-blue-text: #071827;
        --status-teal: #175a63;
        --status-teal-text: #ffffff;
        --status-draft: #bca58a;
        --status-draft-text: #071827;
        --status-slate: #9aadbd;
        --status-slate-text: #17222b;
        --status-muted: #757575;
        --status-muted-text: #ffffff;

        --skeleton-base: #edf1f4;
        --skeleton-shine: #f8fafc;
        --new-highlight: #e6f7ff;
        --shadow-color: rgba(7, 24, 39, 0.14);

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;

        --radius-sm: 6px;
        --radius-md: 8px;

        --transition: 150ms ease;
        --shadow: 0 4px 14px var(--shadow-color);
      }

      html {
        color-scheme: light;
      }

      body {
        min-width: 360px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Geist", sans-serif;
        font-size: 13px;
        line-height: 1.4;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        appearance: none;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--brand-blue);
        outline-offset: 2px;
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .hdr {
        position: sticky;
        top: 0;
        z-index: 100;
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) var(--space-4);
        border-bottom: 1px solid var(--header-hover);
        background: var(--navy);
      }

      .logo {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
      }

      .proj-info {
        min-width: 0;
        color: var(--header-text);
      }

      .proj-title {
        overflow: hidden;
        font-size: 14px;
        font-weight: 750;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-tools {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
        min-width: 0;
        margin-left: auto;
      }

      .search-shell {
        position: relative;
        width: min(280px, 34vw);
        min-width: 180px;
      }

      .hierarchy-search {
        width: 100%;
        height: 34px;
        padding: 0 34px 0 var(--space-3);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--navy);
        font-size: 12px;
        outline: none;
      }

      .hierarchy-search::placeholder {
        color: var(--text-muted);
      }

      .hierarchy-search:focus {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
      .hierarchy-search::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }

      .clear-search {
        position: absolute;
        top: 50%;
        right: var(--space-1);
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 17px;
        line-height: 1;
        transform: translateY(-50%);
      }

      .clear-search:hover {
        background: var(--surface-hover);
        color: var(--navy);
      }

      .clear-search[hidden] {
        display: none;
      }

      .search-results {
        min-width: 56px;
        color: var(--header-muted);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      .hierarchy-control-button {
        height: 34px;
        padding: 0 var(--space-3);
        border: 1px solid var(--header-muted);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--header-text);
        cursor: pointer;
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
        transition:
          background var(--transition),
          border-color var(--transition);
      }

      .hierarchy-control-button:hover {
        border-color: var(--header-text);
        background: var(--header-hover);
      }

      #app {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: var(--space-4);
      }

      .app-notice {
        margin-bottom: var(--space-3);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--warning-border);
        border-radius: var(--radius-sm);
        background: var(--warning-bg);
        color: var(--warning-text);
        font-size: 12px;
        font-weight: 600;
      }

      .app-notice[hidden] {
        display: none;
      }

      #packages {
        display: grid;
        gap: var(--space-2);
      }

      .hierarchy-project {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .tree-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        transition:
          background var(--transition),
          color var(--transition);
      }

      .tree-row:hover {
        background: var(--surface-hover);
      }

      .project-row {
        min-height: 44px;
        padding: var(--space-2) var(--space-3);
      }

      .hierarchy-project.is-open > .project-row {
        background: var(--surface-active);
      }

      .hierarchy-children {
        padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5);
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .hierarchy-section-title,
      .revision-inline-title {
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .hierarchy-section-title {
        padding: var(--space-1) var(--space-2) var(--space-2);
      }

      .hierarchy-package-branch {
        margin-left: var(--space-2);
        padding-left: var(--space-3);
        border-left: 1px solid var(--border);
      }

      .hierarchy-package-branch + .hierarchy-package-branch {
        margin-top: var(--space-1);
      }

      .hierarchy-package-row-shell {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .package-row {
        min-height: 40px;
        flex: 1;
        padding: var(--space-2);
        border-radius: var(--radius-sm);
      }

      .hierarchy-package-branch.is-open
        > .hierarchy-package-row-shell
        .package-row {
        background: var(--surface-active);
      }

      .hierarchy-package-content {
        margin-left: var(--space-4);
        padding: var(--space-1) 0 var(--space-2) var(--space-3);
        border-left: 1px solid var(--border);
      }

      .hierarchy-deliverables {
        display: grid;
        gap: var(--space-1);
      }

      .deliverable-branch {
        margin-left: var(--space-2);
        padding-left: var(--space-3);
        border-left: 1px solid var(--border);
      }

      .deliverable-row {
        min-height: 38px;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-sm);
      }

      .deliverable-branch.is-open > .deliverable-row {
        background: var(--surface-active);
      }

      .item-main,
      .deliverable-main {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 0;
      }

      .item-right,
      .deliverable-right {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex: 0 0 auto;
      }

      .item-name,
      .deliverable-name {
        min-width: 0;
        overflow: hidden;
        color: var(--navy);
        font-size: 13px;
        font-weight: 680;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .project-row .item-name {
        font-weight: 760;
      }

      .item-meta {
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 550;
        white-space: nowrap;
      }

      .hierarchy-chevron {
        width: 14px;
        flex: 0 0 14px;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1;
        text-align: center;
        transition:
          transform var(--transition),
          color var(--transition);
      }

      .hierarchy-chevron.open {
        color: var(--brand-blue);
        transform: rotate(90deg);
      }

      .deliverable-type {
        padding: 2px var(--space-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      .inline-add-toggle {
        height: 28px;
        padding: 0 var(--space-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--navy);
        cursor: pointer;
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
      }

      .inline-add-toggle:hover {
        border-color: var(--brand-blue);
        color: var(--brand-blue);
      }

      .inline-add-deliverable {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) 160px auto auto;
        align-items: start;
        gap: var(--space-2);
        margin: var(--space-1) 0 var(--space-3);
        padding: var(--space-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
      }

      .form-field {
        min-width: 0;
      }

      .inline-add-deliverable input,
      .inline-add-deliverable select {
        width: 100%;
        height: 32px;
        padding: 0 var(--space-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--navy);
        font-size: 12px;
        outline: none;
      }

      .inline-add-deliverable input:focus,
      .inline-add-deliverable select:focus {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .field-error,
      .form-error {
        margin-top: var(--space-1);
        color: var(--danger);
        font-size: 11px;
        font-weight: 600;
      }

      .field-error:empty,
      .form-error:empty {
        display: none;
      }

      .form-error {
        grid-column: 1 / -1;
        margin-top: 0;
      }

      .button-primary,
      .button-secondary {
        height: 32px;
        padding: 0 var(--space-3);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
      }

      .button-primary {
        border: 1px solid var(--navy);
        background: var(--navy);
        color: var(--header-text);
      }

      .button-primary:hover:not(:disabled) {
        background: var(--header-hover);
      }

      .button-secondary {
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--navy);
      }

      .button-secondary:hover:not(:disabled) {
        border-color: var(--brand-blue);
        color: var(--brand-blue);
      }

      .revision-inline {
        margin: var(--space-1) 0 var(--space-3) var(--space-5);
      }

      .revision-inline-title {
        padding: var(--space-1) 0 var(--space-2);
      }

      .revision-table-wrap {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .revision-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        background: var(--surface);
        font-size: 12px;
      }

      .revision-table th,
      .revision-table td {
        height: 36px;
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }

      .revision-table th {
        background: var(--surface-muted);
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
      }

      .revision-table tbody tr:last-child td {
        border-bottom: 0;
      }

      .revision-table tbody tr:hover {
        background: var(--surface-hover);
      }

      .revision-row-current {
        background: var(--surface-active);
      }

      .revision-row-current td:first-child {
        border-left: 3px solid var(--brand-blue);
      }

      .revision-row-superseded {
        background: var(--surface-muted);
      }

      .revision-row-superseded td {
        color: var(--text-muted);
      }

      .revision-code-cell {
        white-space: nowrap;
      }

      .revision-code {
        color: var(--navy);
        font-weight: 750;
      }

      .current-badge,
      .superseded-badge {
        display: inline-flex;
        align-items: center;
        margin-left: var(--space-2);
        padding: 1px var(--space-2);
        border-radius: var(--radius-sm);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .current-badge {
        background: var(--brand-blue);
        color: var(--navy);
      }

      .superseded-badge {
        background: var(--border);
        color: var(--text-soft);
      }

      .status-cell {
        min-width: 0;
      }

      .status-control {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 0;
      }

      .status-received-select,
      .action-select {
        height: 28px;
        min-width: 0;
        padding: 0 var(--space-2);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--navy);
        cursor: pointer;
        font-size: 11px;
        font-weight: 680;
        outline: none;
      }

      .status-received-select {
        width: 120px;
      }

      .action-select {
        width: 180px;
      }

      .status-received-select:focus,
      .action-select:focus {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .status-received-select:disabled,
      .action-select:disabled {
        border-style: dashed;
        cursor: not-allowed;
        filter: saturate(0.45);
      }

      .status-green {
        border-color: var(--status-green);
        background: var(--status-green);
        color: var(--status-green-text);
      }

      .status-amber {
        border-color: var(--status-amber);
        background: var(--status-amber);
        color: var(--status-amber-text);
      }

      .status-red {
        border-color: var(--status-red);
        background: var(--status-red);
        color: var(--status-red-text);
      }

      .status-blue {
        border-color: var(--status-blue);
        background: var(--status-blue);
        color: var(--status-blue-text);
      }

      .status-teal {
        border-color: var(--status-teal);
        background: var(--status-teal);
        color: var(--status-teal-text);
      }

      .status-draft {
        border-color: var(--status-draft);
        background: var(--status-draft);
        color: var(--status-draft-text);
      }

      .status-slate {
        border-color: var(--status-slate);
        background: var(--status-slate);
        color: var(--status-slate-text);
      }

      .status-muted {
        border-color: var(--status-muted);
        background: var(--status-muted);
        color: var(--status-muted-text);
      }

      .save-indicator {
        display: none;
        align-items: center;
        gap: var(--space-1);
        color: var(--text-muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .save-indicator.visible {
        display: inline-flex;
      }

      .save-spinner {
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--brand-blue);
        border-radius: 50%;
        animation: save-spin 650ms linear infinite;
      }

      @keyframes save-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hierarchy-empty,
      .state-panel {
        padding: var(--space-4);
        color: var(--text-muted);
        font-size: 12px;
      }

      .state-panel {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .state-panel h2 {
        margin: 0 0 var(--space-1);
        color: var(--navy);
        font-size: 14px;
      }

      .state-panel p {
        margin: 0 0 var(--space-3);
      }

      .skeleton-row {
        height: 44px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: linear-gradient(
          90deg,
          var(--skeleton-base) 25%,
          var(--skeleton-shine) 50%,
          var(--skeleton-base) 75%
        );
        background-size: 200% 100%;
        animation: skeleton-loading 1.2s linear infinite;
      }

      @keyframes skeleton-loading {
        to {
          background-position: -200% 0;
        }
      }

      .deliverable-branch.is-new > .deliverable-row {
        animation: new-deliverable-highlight 1.6s ease;
      }

      @keyframes new-deliverable-highlight {
        0%,
        55% {
          background: var(--new-highlight);
        }

        100% {
          background: transparent;
        }
      }

      mark {
        padding: 0 1px;
        border-radius: 2px;
        background: var(--mark-bg);
        color: inherit;
      }

      .search-field-match {
        box-shadow: 0 0 0 2px var(--mark-bg);
      }

      .toast {
        position: fixed;
        right: var(--space-4);
        bottom: var(--space-4);
        z-index: 1000;
        max-width: min(420px, calc(100vw - 32px));
        padding: var(--space-3) var(--space-4);
        border-left: 4px solid var(--brand-blue);
        border-radius: var(--radius-md);
        background: var(--navy);
        color: var(--header-text);
        box-shadow: var(--shadow);
        font-size: 12px;
        transform: translateY(12px);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity var(--transition),
          transform var(--transition);
      }

      .toast.visible {
        transform: translateY(0);
        opacity: 1;
      }

      .toast.error {
        border-left-color: var(--status-red);
      }

      .toast.warning {
        border-left-color: var(--status-amber);
      }

      .toast.success {
        border-left-color: var(--status-green);
      }

      @media (max-width: 760px) {
        .hdr {
          flex-wrap: wrap;
        }

        .header-tools {
          width: 100%;
          flex: 1 1 100%;
          justify-content: flex-start;
        }

        .search-shell {
          flex: 1 1 200px;
          width: auto;
        }

        .inline-add-deliverable {
          grid-template-columns: minmax(0, 1fr) 140px auto auto;
        }
      }

      @media (max-width: 640px) {
        #app {
          padding: var(--space-3);
        }

        .search-results {
          display: none;
        }

        .hierarchy-children {
          padding-left: var(--space-3);
        }

        .hierarchy-package-branch {
          margin-left: var(--space-1);
          padding-left: var(--space-2);
        }

        .hierarchy-package-content {
          margin-left: var(--space-2);
          padding-left: var(--space-2);
        }

        .deliverable-branch {
          margin-left: var(--space-1);
          padding-left: var(--space-2);
        }

        .revision-inline {
          margin-left: var(--space-2);
        }

        .inline-add-deliverable {
          grid-template-columns: 1fr 1fr;
        }

        .form-error {
          grid-column: 1 / -1;
        }

        .revision-table-wrap {
          overflow: visible;
          border: 0;
          background: transparent;
        }

        .revision-table,
        .revision-table tbody {
          display: block;
        }

        .revision-table thead {
          display: none;
        }

        .revision-table tr {
          display: grid;
          margin-bottom: var(--space-2);
          padding: var(--space-2);
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          background: var(--surface);
        }

        .revision-table th,
        .revision-table td {
          height: auto;
          border: 0;
        }

        .revision-table td {
          display: grid;
          grid-template-columns: 108px minmax(0, 1fr);
          align-items: center;
          gap: var(--space-2);
          padding: var(--space-1);
        }

        .revision-table td::before {
          content: attr(data-label);
          color: var(--text-muted);
          font-size: 11px;
          font-weight: 700;
        }

        .revision-row-current td:first-child {
          border-left: 0;
        }

        .revision-row-current {
          border-left: 3px solid var(--brand-blue) !important;
          background: var(--surface-active) !important;
        }

        .status-control {
          width: 100%;
        }

        .status-received-select,
        .action-select {
          width: 100%;
        }
      }

      @media (max-width: 460px) {
        .header-tools {
          gap: var(--space-1);
        }

        .search-shell {
          flex-basis: 100%;
        }

        .hierarchy-control-button {
          flex: 1;
        }

        .inline-add-deliverable {
          grid-template-columns: 1fr;
        }

        .form-error {
          grid-column: 1;
        }

        .item-right {
          gap: var(--space-1);
        }

        .item-meta {
          white-space: normal;
          text-align: right;
        }

        .revision-table td {
          grid-template-columns: 92px minmax(0, 1fr);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

    <script>
      const monday = window.mondaySdk();

      const CONFIG = {
        projectsBoard: "5100469221",
        packagesBoard: "5100466592",
        packagesSubitemBoard: "5100466841",
        revisionsBoard: "5100466600",
        revisionsSubitemBoard: "5102512378",

        packageCategoryColumn: "dropdown_mm5bqa8j",
        projectPackagesRelation: "board_relation_mm5a7nn3",

        revisionDeliverableRelation: "board_relation_mm5ae5am",
        revisionVersionColumn: "dropdown_mm6krj3c",
        statusReceivedColumn: "color_mm6k5xec",
      };

      async function loadAppData() {
        const query = `
          query (
            $projectsBoard: [ID!]!,
            $revisionsBoard: [ID!]!
          ) {
            projectBoards: boards(ids: $projectsBoard) {
              items_page(limit: 100) {
                items {
                  id
                  name

                  column_values(ids: ["board_relation_mm5a7nn3"]) {
                    ... on BoardRelationValue {
                      linked_items {
                        id
                        name

                        subitems {
                          id
                          name

                          column_values(ids: ["dropdown_mm5bqa8j"]) {
                            id
                            text
                          }
                        }
                      }
                    }
                  }
                }
              }
            }

            revisionBoards: boards(ids: $revisionsBoard) {
              items_page(limit: 100) {
                items {
                  id
                  name

                  column_values(ids: ["board_relation_mm5ae5am"]) {
                    ... on BoardRelationValue {
                      linked_item_ids
                    }
                  }

                              subitems {
                    id
                    name

                    column_values(
                      ids: [
                        "text_mm6k63yk",
                        "date_mm6krfrv",
                        "color_mm6k5xec",
                        "color_mm6v5zh2",
                        "dropdown_mm6krj3c"
                      ]
                    ) {
                      id
                      text
                    }
                  }
                }
              }
            }
          }
        `;

        const response = await monday.api(query, {
          apiVersion: "2026-07",
          variables: {
            projectsBoard: [CONFIG.projectsBoard],
            revisionsBoard: [CONFIG.revisionsBoard],
          },
        });

        console.log("APP DATA RESPONSE:", response);

        if (response.errors) {
          throw new Error(JSON.stringify(response.errors, null, 2));
        }

        const projectItems = response.data.projectBoards[0].items_page.items;

        const revisions = response.data.revisionBoards[0].items_page.items;

        const projects = projectItems.map((project) => ({
          id: project.id,
          name: project.name,
          packages: project.column_values[0]?.linked_items || [],
        }));

        const limitWarnings = [];

        if (projectItems.length === 100) {
          limitWarnings.push(
            "The project query reached its 100-item limit; additional projects may not be shown.",
          );
        }

        if (revisions.length === 100) {
          limitWarnings.push(
            "The revisions query reached its 100-item limit; additional revisions may not be shown.",
          );
        }

        paginationWarning = limitWarnings.join(" ");

        return {
          projects,
          revisions,
        };
      }

      async function createDeliverable(packageId, name, category) {
        // STEP 1 — create the deliverable
        const createQuery = `
          mutation (
            $parentId: ID!,
            $name: String!
          ) {
            create_subitem(
              parent_item_id: $parentId,
              item_name: $name
            ) {
              id
              name
            }
          }
        `;

        const createResponse = await monday.api(createQuery, {
          apiVersion: "2026-07",
          variables: {
            parentId: packageId,
            name: name,
          },
        });

        const deliverable = createResponse.data.create_subitem;

        // STEP 2 — update Category separately
        const categoryQuery = `
          mutation (
            $boardId: ID!,
            $itemId: ID!,
            $columnId: String!,
            $value: String!
          ) {
            change_simple_column_value(
              board_id: $boardId,
              item_id: $itemId,
              column_id: $columnId,
              value: $value
            ) {
              id
            }
          }
        `;

        try {
          const categoryResponse = await monday.api(categoryQuery, {
            apiVersion: "2026-07",
            variables: {
              boardId: CONFIG.packagesSubitemBoard,
              itemId: deliverable.id,
              columnId: CONFIG.packageCategoryColumn,
              value: category,
            },
          });

          if (categoryResponse.errors) {
            throw new Error(JSON.stringify(categoryResponse.errors));
          }
        } catch (error) {
          const categoryError =
            error instanceof Error ? error : new Error(String(error));

          categoryError.partialDeliverable = deliverable;

          throw categoryError;
        }

        return deliverable;
      }

      let appData = null;
      let isSyncing = false;
      let searchTerm = "";
      let searchTimer = null;
      let paginationWarning = "";
      let saveInFlightCount = 0;
      let highlightDeliverableId = null;
      let liveSyncStarted = false;
      let interactionsStarted = false;
      let toastTimer = null;

      let revisionByDeliverableId = new Map();
      let revisionSubitemById = new Map();

      let searchIndex = [];
      let searchResults = [];

      const matchedProjectIds = new Set();
      const matchedPackageIds = new Set();
      const matchedDeliverableIds = new Set();
      const matchedRevisionIds = new Set();

      const searchScoreByProjectId = new Map();
      const searchScoreByPackageId = new Map();
      const searchScoreByDeliverableId = new Map();

      const expandedProjectIds = new Set();
      const expandedPackageIds = new Set();
      const expandedDeliverableIds = new Set();
      const openAddFormPackageIds = new Set();

      const UI_SETTINGS = Object.freeze({
        autoCollapseProjectSiblings: false,
      });

      const STATUS_CLASSES = [
        "status-green",
        "status-amber",
        "status-red",
        "status-blue",
        "status-teal",
        "status-draft",
        "status-slate",
        "status-muted",
      ];

      const HTML_ESCAPES = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      };

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (character) => HTML_ESCAPES[character],
        );
      }

      function domId(value) {
        return String(value ?? "").replace(/[^a-zA-Z0-9_-]/g, "-");
      }

      function normaliseSearch(value) {
        return String(value ?? "")
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function getSearchTokens(value = searchTerm) {
        return normaliseSearch(value).split(/\s+/).filter(Boolean);
      }

      function highlightMatch(value) {
        const rawValue = String(value ?? "");

        if (!searchTerm) {
          return escapeHtml(rawValue);
        }

        const tokens = getSearchTokens().filter((token) => token.length > 0);
        const lowerValue = rawValue.toLowerCase();
        const ranges = [];

        for (const token of tokens) {
          let fromIndex = 0;
          let matchIndex = lowerValue.indexOf(token, fromIndex);

          while (matchIndex !== -1) {
            ranges.push([matchIndex, matchIndex + token.length]);
            fromIndex = matchIndex + token.length;
            matchIndex = lowerValue.indexOf(token, fromIndex);
          }
        }

        if (!ranges.length) {
          return valueMatchesSearch(rawValue)
            ? `<mark>${escapeHtml(rawValue)}</mark>`
            : escapeHtml(rawValue);
        }

        ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);

        const mergedRanges = [];

        for (const range of ranges) {
          const previous = mergedRanges[mergedRanges.length - 1];

          if (!previous || range[0] > previous[1]) {
            mergedRanges.push([...range]);
          } else {
            previous[1] = Math.max(previous[1], range[1]);
          }
        }

        let cursor = 0;
        let html = "";

        for (const [startIndex, endIndex] of mergedRanges) {
          html += escapeHtml(rawValue.slice(cursor, startIndex));
          html += `<mark>${escapeHtml(
            rawValue.slice(startIndex, endIndex),
          )}</mark>`;
          cursor = endIndex;
        }

        html += escapeHtml(rawValue.slice(cursor));

        return html;
      }

      function boundedEditDistance(a, b, maxDistance) {
        if (a === b) {
          return 0;
        }

        if (Math.abs(a.length - b.length) > maxDistance) {
          return maxDistance + 1;
        }

        let previous = Array.from(
          { length: b.length + 1 },
          (_, index) => index,
        );

        for (let i = 1; i <= a.length; i += 1) {
          const current = [i];
          let rowMinimum = current[0];

          for (let j = 1; j <= b.length; j += 1) {
            const substitutionCost = a[i - 1] === b[j - 1] ? 0 : 1;

            const value = Math.min(
              previous[j] + 1,
              current[j - 1] + 1,
              previous[j - 1] + substitutionCost,
            );

            current[j] = value;
            rowMinimum = Math.min(rowMinimum, value);
          }

          if (rowMinimum > maxDistance) {
            return maxDistance + 1;
          }

          previous = current;
        }

        return previous[b.length];
      }

      function scoreTokenAgainstValue(token, normalisedValue, fieldWeight = 0) {
        if (!token || !normalisedValue) {
          return 0;
        }

        if (normalisedValue === token) {
          return 130 + fieldWeight;
        }

        const words = normalisedValue.split(" ").filter(Boolean);

        if (words.includes(token)) {
          return 115 + fieldWeight;
        }

        if (words.some((word) => word.startsWith(token))) {
          return 95 + fieldWeight;
        }

        if (normalisedValue.startsWith(token)) {
          return 90 + fieldWeight;
        }

        if (normalisedValue.includes(token)) {
          return 70 + fieldWeight;
        }

        if (token.length < 4) {
          return 0;
        }

        const maxDistance = token.length >= 8 ? 2 : 1;
        let bestDistance = maxDistance + 1;

        for (const word of words) {
          if (Math.abs(word.length - token.length) > maxDistance) {
            continue;
          }

          bestDistance = Math.min(
            bestDistance,
            boundedEditDistance(token, word, maxDistance),
          );

          if (bestDistance === 1) {
            break;
          }
        }

        return bestDistance <= maxDistance
          ? 48 + fieldWeight - bestDistance * 6
          : 0;
      }

      function valueMatchesSearch(value) {
        if (!searchTerm) {
          return false;
        }

        const normalisedValue = normaliseSearch(value);

        return getSearchTokens().some(
          (token) => scoreTokenAgainstValue(token, normalisedValue) > 0,
        );
      }

      function getColumnText(item, columnId) {
        return (
          item?.column_values?.find((column) => column.id === columnId)?.text ||
          ""
        );
      }

      function addSearchIndexRecord({
        project,
        pkg = null,
        deliverable = null,
        revision = null,
      }) {
        const category = deliverable
          ? getColumnText(deliverable, CONFIG.packageCategoryColumn)
          : "";

        const revisionCode = getColumnText(revision, "text_mm6k63yk");
        const dateIssued = getColumnText(revision, "date_mm6krfrv");
        const statusReceived = getColumnText(
          revision,
          CONFIG.statusReceivedColumn,
        );
        const action = getColumnText(revision, "color_mm6v5zh2");
        const version = getColumnText(revision, CONFIG.revisionVersionColumn);

        const fields = [
          { value: project?.name, weight: 22 },
          { value: pkg?.name, weight: 24 },
          { value: deliverable?.name, weight: 30 },
          { value: category, weight: 14 },
          { value: revisionCode, weight: 34 },
          { value: dateIssued, weight: 8 },
          { value: formatDate(dateIssued), weight: 8 },
          { value: statusReceived, weight: 12 },
          { value: action, weight: 12 },
          { value: version, weight: 8 },
        ]
          .map((field) => ({
            value: normaliseSearch(field.value),
            weight: field.weight,
          }))
          .filter((field) => field.value);

        searchIndex.push({
          projectId: String(project.id),
          packageId: pkg ? String(pkg.id) : null,
          deliverableId: deliverable ? String(deliverable.id) : null,
          revisionId: revision ? String(revision.id) : null,
          fields,
          searchText: fields.map((field) => field.value).join(" "),
        });
      }

      function buildSearchIndex() {
        searchIndex = [];

        for (const project of appData?.projects || []) {
          const packages = project.packages || [];

          if (!packages.length) {
            addSearchIndexRecord({ project });
            continue;
          }

          for (const pkg of packages) {
            const deliverables = pkg.subitems || [];

            if (!deliverables.length) {
              addSearchIndexRecord({ project, pkg });
              continue;
            }

            for (const deliverable of deliverables) {
              const revisionRecord = revisionByDeliverableId.get(
                String(deliverable.id),
              );

              const revisions = revisionRecord?.subitems || [];

              if (!revisions.length) {
                addSearchIndexRecord({ project, pkg, deliverable });
                continue;
              }

              for (const revision of revisions) {
                addSearchIndexRecord({
                  project,
                  pkg,
                  deliverable,
                  revision,
                });
              }
            }
          }
        }
      }

      function scoreSearchRecord(record, query, tokens) {
        let score = 0;

        for (const token of tokens) {
          let tokenScore = 0;

          for (const field of record.fields) {
            tokenScore = Math.max(
              tokenScore,
              scoreTokenAgainstValue(token, field.value, field.weight),
            );
          }

          if (!tokenScore) {
            return 0;
          }

          score += tokenScore;
        }

        if (query && record.searchText.includes(query)) {
          score += 60;
        }

        return score;
      }

      function searchRecords(term) {
        const query = normaliseSearch(term);
        const tokens = getSearchTokens(query);

        if (!tokens.length) {
          return [];
        }

        return searchIndex
          .map((record) => ({
            record,
            score: scoreSearchRecord(record, query, tokens),
          }))
          .filter((result) => result.score > 0)
          .sort((a, b) => b.score - a.score);
      }

      function setHighestScore(map, id, score) {
        map.set(id, Math.max(map.get(id) || 0, score));
      }

      function buildSearchVisibility() {
        matchedProjectIds.clear();
        matchedPackageIds.clear();
        matchedDeliverableIds.clear();
        matchedRevisionIds.clear();

        searchScoreByProjectId.clear();
        searchScoreByPackageId.clear();
        searchScoreByDeliverableId.clear();

        for (const result of searchResults) {
          const { record, score } = result;

          matchedProjectIds.add(record.projectId);
          setHighestScore(searchScoreByProjectId, record.projectId, score);

          if (record.packageId) {
            matchedPackageIds.add(record.packageId);
            setHighestScore(searchScoreByPackageId, record.packageId, score);
          }

          if (record.deliverableId) {
            matchedDeliverableIds.add(record.deliverableId);
            setHighestScore(
              searchScoreByDeliverableId,
              record.deliverableId,
              score,
            );
          }

          if (record.revisionId) {
            matchedRevisionIds.add(record.revisionId);
          }
        }
      }

      function refreshSearchResults() {
        if (!searchTerm) {
          searchResults = [];
          buildSearchVisibility();
          return;
        }

        searchResults = searchRecords(searchTerm);
        buildSearchVisibility();
      }

      function runSearch(value) {
        searchTerm = normaliseSearch(value);
        refreshSearchResults();
      }

      function sortBySearchScore(items, scoreMap) {
        if (!searchTerm) {
          return items;
        }

        return [...items].sort(
          (a, b) =>
            (scoreMap.get(String(b.id)) || 0) -
            (scoreMap.get(String(a.id)) || 0),
        );
      }

      function rebuildDataIndexes() {
        revisionByDeliverableId = new Map();
        revisionSubitemById = new Map();

        for (const revisionRecord of appData?.revisions || []) {
          for (const column of revisionRecord.column_values || []) {
            for (const linkedItemId of column.linked_item_ids || []) {
              revisionByDeliverableId.set(String(linkedItemId), revisionRecord);
            }
          }

          for (const revision of revisionRecord.subitems || []) {
            revisionSubitemById.set(String(revision.id), revision);
          }
        }
      }

      function setAppData(data) {
        appData = data;
        rebuildDataIndexes();
        buildSearchIndex();
        refreshSearchResults();
      }

      function updateLocalRevisionColumn(revisionSubitemId, columnId, value) {
        const revision = revisionSubitemById.get(String(revisionSubitemId));

        if (!revision) {
          return;
        }

        const column = revision.column_values?.find(
          (item) => item.id === columnId,
        );

        if (column) {
          column.text = value || "";
        }
      }

      function applyStatusClass(element, value) {
        if (!element) {
          return;
        }

        element.classList.remove(...STATUS_CLASSES);

        const statusClass = getStatusClass(value);

        if (statusClass) {
          element.classList.add(statusClass);
        }
      }

      function setControlTitle(selectElement, title) {
        if (!selectElement) {
          return;
        }

        selectElement.title = title;

        const wrapper = selectElement.closest(".status-control");

        if (wrapper) {
          wrapper.title = title;
        }
      }

      function syncRowControls(row) {
        if (!row) {
          return;
        }

        const version = row.dataset.version || "";
        const isSuperseded = version === "Superseded";

        const actionSelect = row.querySelector(".action-select");
        const statusSelect = row.querySelector(".status-received-select");

        const actionSaving = actionSelect?.dataset.saving === "true";

        const statusSaving = statusSelect?.dataset.saving === "true";

        if (actionSelect) {
          actionSelect.disabled = isSuperseded || actionSaving;

          setControlTitle(
            actionSelect,
            isSuperseded
              ? "Superseded revisions cannot be changed"
              : actionSaving
                ? "Saving change"
                : "Action",
          );
        }

        if (statusSelect) {
          const action = actionSelect?.value || "";

          const statusDisabled =
            isSuperseded || action !== "Issued" || actionSaving || statusSaving;

          statusSelect.disabled = statusDisabled;

          let title = "Status Received";

          if (isSuperseded) {
            title = "Superseded revisions cannot be changed";
          } else if (actionSaving) {
            title = "Wait for Action to finish saving";
          } else if (action !== "Issued") {
            title = "Available once Action is Issued";
          } else if (statusSaving) {
            title = "Saving change";
          }

          setControlTitle(statusSelect, title);
        }
      }

      function setSavingState(selectElement, isSaving) {
        if (!selectElement) {
          return;
        }

        selectElement.dataset.saving = isSaving ? "true" : "false";

        const wrapper = selectElement.closest(".status-control");

        const indicator = wrapper?.querySelector(".save-indicator");

        if (indicator) {
          indicator.classList.toggle("visible", isSaving);
        }

        syncRowControls(selectElement.closest("tr"));
      }

      function showToast(message, type = "error") {
        const toast = document.getElementById("toast");

        if (!toast) {
          return;
        }

        window.clearTimeout(toastTimer);

        toast.textContent = message;
        toast.className = `toast ${type} visible`;

        toastTimer = window.setTimeout(() => {
          toast.classList.remove("visible");
        }, 4000);
      }

      function renderPaginationWarning() {
        const notice = document.getElementById("appNotice");

        if (!notice) {
          return;
        }

        notice.textContent = paginationWarning;
        notice.hidden = !paginationWarning;
      }

      async function updateStatusReceived(
        revisionSubitemId,
        status,
        deliverableId,
        selectElement,
      ) {
        const query = `
          mutation (
            $boardId: ID!,
            $itemId: ID!,
            $columnId: String!,
            $value: String!
          ) {
            change_simple_column_value(
              board_id: $boardId,
              item_id: $itemId,
              column_id: $columnId,
              value: $value
            ) {
              id
            }
          }
        `;

        const previousValue = selectElement.dataset.currentValue || "";

        expandedDeliverableIds.add(String(deliverableId));

        selectElement.dataset.currentValue = status;

        updateLocalRevisionColumn(
          revisionSubitemId,
          CONFIG.statusReceivedColumn,
          status,
        );
        buildSearchIndex();
        refreshSearchResults();

        applyStatusClass(selectElement, status);

        saveInFlightCount += 1;
        setSavingState(selectElement, true);

        try {
          const response = await monday.api(query, {
            apiVersion: "2026-07",
            variables: {
              boardId: CONFIG.revisionsSubitemBoard,
              itemId: revisionSubitemId,
              columnId: CONFIG.statusReceivedColumn,
              value: status,
            },
          });

          if (response.errors) {
            throw new Error(JSON.stringify(response.errors));
          }
        } catch (error) {
          console.error("Failed to update Status Received:", error);

          selectElement.value = previousValue;
          selectElement.dataset.currentValue = previousValue;

          updateLocalRevisionColumn(
            revisionSubitemId,
            CONFIG.statusReceivedColumn,
            previousValue,
          );
          buildSearchIndex();
          refreshSearchResults();

          applyStatusClass(selectElement, previousValue);

          showToast(
            "Status Received was not saved. The previous value has been restored.",
          );
        } finally {
          saveInFlightCount = Math.max(0, saveInFlightCount - 1);

          setSavingState(selectElement, false);
        }
      }

      function handleSearchInput(value) {
        const clearButton = document.getElementById("clearSearchButton");

        if (clearButton) {
          clearButton.hidden = !value;
        }

        window.clearTimeout(searchTimer);

        searchTimer = window.setTimeout(() => {
          runSearch(value);
          renderWorkspace();
        }, 200);
      }

      function clearSearch() {
        window.clearTimeout(searchTimer);

        runSearch("");

        const searchInput = document.getElementById("hierarchySearch");

        if (searchInput) {
          searchInput.value = "";
        }

        const clearButton = document.getElementById("clearSearchButton");

        if (clearButton) {
          clearButton.hidden = true;
        }

        renderWorkspace();
      }

      function projectHasSearchMatch(project) {
        return !searchTerm || matchedProjectIds.has(String(project.id));
      }

      function getVisiblePackages(project) {
        const packages = project.packages || [];

        if (!searchTerm) {
          return packages;
        }

        return sortBySearchScore(
          packages.filter((pkg) => matchedPackageIds.has(String(pkg.id))),
          searchScoreByPackageId,
        );
      }

      function getVisibleDeliverables(project, pkg) {
        const deliverables = pkg.subitems || [];

        if (!searchTerm) {
          return deliverables;
        }

        return sortBySearchScore(
          deliverables.filter((deliverable) =>
            matchedDeliverableIds.has(String(deliverable.id)),
          ),
          searchScoreByDeliverableId,
        );
      }

      function countSearchResults() {
        return searchTerm ? searchResults.length : 0;
      }

      function areAllExpanded() {
        if (!appData?.projects?.length) {
          return false;
        }

        return appData.projects.every(
          (project) =>
            expandedProjectIds.has(String(project.id)) &&
            (project.packages || []).every(
              (pkg) =>
                expandedPackageIds.has(String(pkg.id)) &&
                (pkg.subitems || []).every((deliverable) =>
                  expandedDeliverableIds.has(String(deliverable.id)),
                ),
            ),
        );
      }

      function updateToolbarState() {
        const toggle = document.getElementById("expandToggle");

        const results = document.getElementById("searchResults");

        if (toggle) {
          toggle.textContent = areAllExpanded() ? "Collapse all" : "Expand all";
        }

        if (results) {
          const count = countSearchResults();

          results.textContent = searchTerm
            ? `${count} ${count === 1 ? "result" : "results"}`
            : "";
        }
      }

      function expandAll() {
        expandedProjectIds.clear();
        expandedPackageIds.clear();
        expandedDeliverableIds.clear();

        for (const project of appData?.projects || []) {
          expandedProjectIds.add(String(project.id));

          for (const pkg of project.packages || []) {
            expandedPackageIds.add(String(pkg.id));

            for (const deliverable of pkg.subitems || []) {
              expandedDeliverableIds.add(String(deliverable.id));
            }
          }
        }

        renderWorkspace();
      }

      function collapseAll() {
        expandedProjectIds.clear();
        expandedPackageIds.clear();
        expandedDeliverableIds.clear();

        renderWorkspace();
      }

      function toggleAll() {
        if (areAllExpanded()) {
          collapseAll();
        } else {
          expandAll();
        }
      }

      function toggleProject(projectId) {
        const id = String(projectId);

        if (expandedProjectIds.has(id)) {
          expandedProjectIds.delete(id);
        } else {
          if (UI_SETTINGS.autoCollapseProjectSiblings) {
            expandedProjectIds.clear();
          }

          expandedProjectIds.add(id);
        }

        renderWorkspace();
      }

      function togglePackage(projectId, packageId) {
        const id = String(packageId);

        if (expandedPackageIds.has(id)) {
          expandedPackageIds.delete(id);
        } else {
          expandedPackageIds.add(id);
        }

        renderWorkspace();
      }

      function toggleDeliverable(projectId, packageId, deliverableId) {
        const id = String(deliverableId);

        if (expandedDeliverableIds.has(id)) {
          expandedDeliverableIds.delete(id);
        } else {
          expandedDeliverableIds.add(id);
        }

        renderWorkspace();
      }

      function restoreScrollPosition(scrollPosition) {
        if (scrollPosition === null) {
          return;
        }

        requestAnimationFrame(() => {
          window.scrollTo({
            top: scrollPosition,
            left: 0,
            behavior: "auto",
          });
        });
      }

      function renderWorkspace({ preserveScroll = true } = {}) {
        if (!appData) {
          return;
        }

        const scrollPosition = preserveScroll ? window.scrollY : null;

        updateToolbarState();
        renderPaginationWarning();

        const container = document.getElementById("packages");

        if (!appData.projects.length) {
          container.innerHTML = `
            <section class="state-panel">
              No projects yet.
            </section>
          `;

          restoreScrollPosition(scrollPosition);
          return;
        }

        const visibleProjects = searchTerm
          ? sortBySearchScore(
              appData.projects.filter(projectHasSearchMatch),
              searchScoreByProjectId,
            )
          : appData.projects;

        if (!visibleProjects.length) {
          container.innerHTML = `
            <section class="state-panel">
              No matching projects, packages or deliverables.
            </section>
          `;

          restoreScrollPosition(scrollPosition);
          return;
        }

        container.innerHTML = visibleProjects
          .map((project) => {
            const projectId = String(project.id);
            const projectPanelId = `project-panel-${domId(projectId)}`;

            const projectOpen =
              expandedProjectIds.has(projectId) ||
              Boolean(searchTerm && projectHasSearchMatch(project));

            return `
              <section
                class="hierarchy-project ${projectOpen ? "is-open" : ""}"
                data-project-id="${escapeHtml(projectId)}"
              >
                <button
                  type="button"
                  class="tree-row project-row"
                  data-action="toggle-project"
                  data-project-id="${escapeHtml(projectId)}"
                  aria-expanded="${projectOpen}"
                  aria-controls="${projectPanelId}"
                >
                  <span class="item-main">
                    <span
                      class="hierarchy-chevron ${projectOpen ? "open" : ""}"
                      aria-hidden="true"
                    >▶</span>

                    <span class="item-name">
                      ${highlightMatch(project.name)}
                    </span>
                  </span>

                  <span class="item-meta">
                    ${(project.packages || []).length}
                    ${
                      (project.packages || []).length === 1
                        ? "Package"
                        : "Packages"
                    }
                  </span>
                </button>

                ${
                  projectOpen
                    ? `
                      <div id="${projectPanelId}">
                        ${renderProjectPackages(project)}
                      </div>
                    `
                    : ""
                }
              </section>
            `;
          })
          .join("");

        restoreScrollPosition(scrollPosition);
      }

      function renderProjectPackages(project) {
        const visiblePackages = getVisiblePackages(project);

        if (!visiblePackages.length) {
          return `
            <div class="hierarchy-children">
              <div class="hierarchy-empty">
                ${searchTerm ? "No matching packages." : "No packages yet."}
              </div>
            </div>
          `;
        }

        return `
          <div class="hierarchy-children">
            <div class="hierarchy-section-title">
              Packages
            </div>

            ${visiblePackages
              .map((pkg) => {
                const packageId = String(pkg.id);
                const packagePanelId = `package-panel-${domId(packageId)}`;
                const addFormId = `add-form-${domId(packageId)}`;

                const packageHasSearchMatch =
                  searchTerm && matchedPackageIds.has(packageId);

                const packageOpen =
                  expandedPackageIds.has(packageId) ||
                  Boolean(packageHasSearchMatch);

                const addFormOpen = openAddFormPackageIds.has(packageId);

                return `
                  <div
                    class="hierarchy-package-branch ${
                      packageOpen ? "is-open" : ""
                    }"

                    <div class="hierarchy-package-row-shell">
                      <button
                        type="button"
                        class="tree-row package-row"

                        data-project-id="${escapeHtml(project.id)}"
                        data-package-id="${escapeHtml(packageId)}"
                        aria-expanded="${packageOpen}"
                        aria-controls="${packagePanelId}"
                      >
                        <span class="item-main">
                          <span
                            class="hierarchy-chevron ${
                              packageOpen ? "open" : ""
                            }"
                            aria-hidden="true"
                          >▶</span>

                          <span class="item-name">
                            ${highlightMatch(pkg.name)}
                          </span>
                        </span>

                        <span class="item-meta">
                          ${(pkg.subitems || []).length}

                            (pkg.subitems || []).length === 1
                              ? "Deliverable"
                              : "Deliverables"

                        </span>
                      </button>

                      ${
                        packageOpen
                          ? `
                            <button
                              type="button"

                          </div>

                    }

                `;

              .join("")}

      function renderPackageDeliverables(project, pkg) {
        const packageId = String(pkg.id);

              openAddFormPackageIds.has(packageId)

                        const isNew = highlightDeliverableId === deliverableId;
