                            data-deliverable-id="${escapeHtml(deliverableId)}"
                          >
                            <button
                              type="button"
                              class="tree-row deliverable-row"
                              data-action="toggle-deliverable"
                              data-project-id="${escapeHtml(project.id)}"
                              data-package-id="${escapeHtml(pkg.id)}"
                              data-deliverable-id="${escapeHtml(deliverableId)}"
                              aria-expanded="${deliverableOpen}"
                              aria-controls="${revisionPanelId}"
                            >
                              <span class="deliverable-main">
                                <span
                                  class="hierarchy-chevron ${
                                    deliverableOpen ? "open" : ""
                                  }"
                                  aria-hidden="true"
                                >▶</span>

                                <span class="deliverable-name">
                                  ${highlightMatch(deliverable.name)}
                                </span>
                              </span>

                              <span class="deliverable-right">
                                <span class="deliverable-type">
                                  ${highlightMatch(category)}
                                </span>
                              </span>
                            </button>

                            ${
                              deliverableOpen
                                ? `
                                  <div
                                    id="${revisionPanelId}"
                                    class="revision-inline"
                                  >
                                    ${renderRevisionSection(deliverableId)}
                                  </div>
                                `
                                : ""
                            }
                          </div>
                        `;
                      })
                      .join("")
                  : `
                    <div class="hierarchy-empty">
                      ${
                        !(pkg.subitems || []).length
                          ? "No deliverables yet."
                          : searchTerm
                            ? "No matching deliverables."
                            : "No deliverables yet."
                      }
                    </div>
                  `
              }
            </div>
          </div>
        `;
      }

      async function updateInternalStatus(
        revisionSubitemId,
        status,
        deliverableId,
        selectElement,
      ) {
        const query = `
                mutation (
                  $boardId: ID!,
                  $itemId: ID!,
                  $columnId: String!,
                  $value: String!
                ) {
                  change_simple_column_value(
                    board_id: $boardId,
                    item_id: $itemId,
                    column_id: $columnId,
                    value: $value
                  ) {
                    id
                  }
                }
              `;

        const previousValue = selectElement.dataset.currentValue || "";

        expandedDeliverableIds.add(String(deliverableId));

        selectElement.dataset.currentValue = status;

        updateLocalRevisionColumn(revisionSubitemId, "color_mm6v5zh2", status);
        buildSearchIndex();
        refreshSearchResults();

        applyStatusClass(selectElement, status);
        syncRowControls(selectElement.closest("tr"));

        saveInFlightCount += 1;
        setSavingState(selectElement, true);

        try {
          const response = await monday.api(query, {
            apiVersion: "2026-07",
            variables: {
              boardId: CONFIG.revisionsSubitemBoard,
              itemId: revisionSubitemId,
              columnId: "color_mm6v5zh2",
              value: status,
            },
          });

          if (response.errors) {
            throw new Error(JSON.stringify(response.errors));
          }
        } catch (error) {
          console.error("Failed to update Internal Status:", error);

          selectElement.value = previousValue;
          selectElement.dataset.currentValue = previousValue;

          updateLocalRevisionColumn(
            revisionSubitemId,
            "color_mm6v5zh2",
            previousValue,
          );
          buildSearchIndex();
          refreshSearchResults();

          applyStatusClass(selectElement, previousValue);

          syncRowControls(selectElement.closest("tr"));

          showToast(
            "Action was not saved. The previous value has been restored.",
          );
        } finally {
          saveInFlightCount = Math.max(0, saveInFlightCount - 1);

          setSavingState(selectElement, false);
        }
      }

      function getStatusClass(value) {
        switch (value) {
          case "A":
            return "status-green";

          case "B":
            return "status-amber";

          case "C":
          case "Not Approved(Internally)":
            return "status-red";

          case "Issued":
            return "status-blue";

          case "Ready for Issue":
            return "status-teal";

          case "Draft":
            return "status-draft";

          case "Sent for Internal Review":
            return "status-slate";

          case "Void":
            return "status-muted";

          default:
            return "";
        }
      }

      function formatDate(value) {
        if (!value || value === "—") {
          return "—";
        }

        const datePart = value.split(" ")[0];
        const [year, month, day] = datePart.split("-").map(Number);

        if (!year || !month || !day) {
          return value;
        }

        return new Intl.DateTimeFormat("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        }).format(new Date(year, month - 1, day));
      }

      function renderRevisionSection(deliverableId) {
        if (!deliverableId) {
          return "";
        }

        const revisionRecord = revisionByDeliverableId.get(
          String(deliverableId),
        );

        const visibleRevisions = revisionRecord?.subitems?.length
          ? searchTerm
            ? revisionRecord.subitems.filter((revision) =>
                matchedRevisionIds.has(String(revision.id)),
              )
            : revisionRecord.subitems
          : [];

        return `
          <div class="revision-inline-title">
            Revisions
          </div>

          ${
            visibleRevisions.length
              ? `
                <div class="revision-table-wrap">
                  <table class="revision-table">
                    <thead>
                      <tr>
                        <th>Revision</th>
                        <th>Date Issued</th>
                        <th>Status Received</th>
                        <th>Action</th>
                      </tr>
                    </thead>

                    <tbody>
                      ${[...visibleRevisions]
                        .reverse()
                        .map((revision) => {
                          const revisionCode =
                            revision.column_values.find(
                              (column) => column.id === "text_mm6k63yk",
                            )?.text || "—";

                          const dateIssued =
                            revision.column_values.find(
                              (column) => column.id === "date_mm6krfrv",
                            )?.text || "—";

                          const statusReceived =
                            revision.column_values.find(
                              (column) => column.id === "color_mm6k5xec",
                            )?.text || "—";

                          const action =
                            revision.column_values.find(
                              (column) => column.id === "color_mm6v5zh2",
                            )?.text || "—";

                          const version =
                            revision.column_values.find(
                              (column) => column.id === "dropdown_mm6krj3c",
                            )?.text || "";

                          const statusValue =
                            statusReceived === "—" ? "" : statusReceived;

                          const actionValue = action === "—" ? "" : action;

                          const isSuperseded = version === "Superseded";

                          const statusDisabled =
                            action !== "Issued" || isSuperseded;

                          const statusTitle = isSuperseded
                            ? "Superseded revisions cannot be changed"
                            : action !== "Issued"
                              ? "Available once Action is Issued"
                              : "Status Received";

                          const actionTitle = isSuperseded
                            ? "Superseded revisions cannot be changed"
                            : "Action";

                          const rowClass =
                            version === "Current"
                              ? "revision-row-current"
                              : isSuperseded
                                ? "revision-row-superseded"
                                : "";

                          return `
                            <tr
                              class="${rowClass}"
                              data-version="${escapeHtml(version)}"
                              data-revision-id="${escapeHtml(revision.id)}"
                            >
                              <td
                                class="revision-code-cell"
                                data-label="Revision"
                              >
                                <span class="revision-code">
                                  ${highlightMatch(revisionCode)}
                                </span>

                                ${
                                  version === "Current"
                                    ? `
                                      <span class="current-badge">
                                        Current
                                      </span>
                                    `
                                    : isSuperseded
                                      ? `
                                        <span class="superseded-badge">
                                          Superseded
                                        </span>
                                      `
                                      : ""
                                }
                              </td>

                              <td data-label="Date Issued">
                                ${highlightMatch(formatDate(dateIssued))}
                              </td>

                              <td
                                class="status-cell"
                                data-label="Status Received"
                              >
                                <span
                                  class="status-control"
                                  title="${escapeHtml(statusTitle)}"
                                >
                                  <select
                                    class="status-received-select ${getStatusClass(
                                      statusReceived,
                                    )} ${
                                      valueMatchesSearch(statusReceived)
                                        ? "search-field-match"
                                        : ""
                                    }"
                                    data-action="change-status-received"
                                    data-revision-id="${escapeHtml(
                                      revision.id,
                                    )}"
                                    data-deliverable-id="${escapeHtml(
                                      deliverableId,
                                    )}"
                                    data-current-value="${escapeHtml(
                                      statusValue,
                                    )}"
                                    data-saving="false"
                                    aria-label="Status Received"
                                    title="${escapeHtml(statusTitle)}"
                                    ${statusDisabled ? "disabled" : ""}
                                  >
                                    <option
                                      value=""
                                      ${
                                        statusReceived === "—" ? "selected" : ""
                                      }
                                    >
                                      —
                                    </option>

                                    <option
                                      value="A"
                                      ${
                                        statusReceived === "A" ? "selected" : ""
                                      }
                                    >
                                      A
                                    </option>

                                    <option
                                      value="B"
                                      ${
                                        statusReceived === "B" ? "selected" : ""
                                      }
                                    >
                                      B
                                    </option>

                                    <option
                                      value="C"
                                      ${
                                        statusReceived === "C" ? "selected" : ""
                                      }
                                    >
                                      C
                                    </option>

                                    <option
                                      value="Void"
                                      ${
                                        statusReceived === "Void"
                                          ? "selected"
                                          : ""
                                      }
                                    >
                                      Void
                                    </option>
                                  </select>

                                  <span
                                    class="save-indicator"
                                    aria-live="polite"
                                  >
                                    <span
                                      class="save-spinner"
                                      aria-hidden="true"
                                    ></span>
                                    <span>Saving…</span>
                                  </span>
                                </span>
                              </td>

                              <td
                                class="status-cell"
                                data-label="Action"
                              >
                                <span
                                  class="status-control"
                                  title="${escapeHtml(actionTitle)}"
                                >
                                  <select
                                    class="action-select ${getStatusClass(
                                      action,
                                    )} ${
                                      valueMatchesSearch(action)
                                        ? "search-field-match"
                                        : ""
                                    }"
                                    data-action="change-action"
                                    data-revision-id="${escapeHtml(
                                      revision.id,
                                    )}"
                                    data-deliverable-id="${escapeHtml(
                                      deliverableId,
                                    )}"
                                    data-current-value="${escapeHtml(
                                      actionValue,
                                    )}"
                                    data-saving="false"
                                    aria-label="Action"
                                    title="${escapeHtml(actionTitle)}"
                                    ${isSuperseded ? "disabled" : ""}
                                  >
                                    <option
                                      value=""
                                      ${action === "—" ? "selected" : ""}
                                    >
                                      —
                                    </option>

                                    <option
                                      value="Draft"
                                      ${action === "Draft" ? "selected" : ""}
                                    >
                                      Draft
                                    </option>

                                    <option
                                      value="Sent for Internal Review"
                                      ${
                                        action === "Sent for Internal Review"
                                          ? "selected"
                                          : ""
                                      }
                                    >
                                      Sent for Internal Review
                                    </option>

                                    <option
                                      value="Ready for Issue"
                                      ${
                                        action === "Ready for Issue"
                                          ? "selected"
                                          : ""
                                      }
                                    >
                                      Ready for Issue
                                    </option>

                                    <option
                                      value="Not Approved(Internally)"
                                      ${
                                        action === "Not Approved(Internally)"
                                          ? "selected"
                                          : ""
                                      }
                                    >
                                      Not Approved(Internally)
                                    </option>

                                    <option
                                      value="Issued"
                                      ${action === "Issued" ? "selected" : ""}
                                    >
                                      Issued
                                    </option>
                                  </select>

                                  <span
                                    class="save-indicator"
                                    aria-live="polite"
                                  >
                                    <span
                                      class="save-spinner"
                                      aria-hidden="true"
                                    ></span>
                                    <span>Saving…</span>
                                  </span>
                                </span>
                              </td>
                            </tr>
                          `;
                        })
                        .join("")}
                    </tbody>
                  </table>
                </div>
              `
              : `
                <div class="hierarchy-empty">
                  ${searchTerm ? "No matching revisions." : "No revisions found."}
                </div>
              `
          }
        `;
      }

      function findAddForm(packageId) {
        return Array.from(document.querySelectorAll("[data-add-form]")).find(
          (form) => form.dataset.packageId === String(packageId),
        );
      }

      function focusAddForm(packageId) {
        requestAnimationFrame(() => {
          const form = findAddForm(packageId);

          form?.querySelector('[name="deliverableName"]')?.focus();
        });
      }

      function setFormSaving(form, isSaving) {
        if (!form) {
          return;
        }

        const controls = form.querySelectorAll("input, select, button");

        controls.forEach((control) => {
          control.disabled = isSaving;
        });

        const submitButton = form.querySelector('button[type="submit"]');

        if (submitButton) {
          submitButton.textContent = isSaving ? "Adding…" : "Add";
        }
      }

      function clearFormErrors(form) {
        form
          ?.querySelectorAll(".field-error, .form-error")
          .forEach((element) => {
            element.textContent = "";
          });
      }

      function toggleAddDeliverable(packageId) {
        const id = String(packageId);

        if (openAddFormPackageIds.has(id)) {
          openAddFormPackageIds.delete(id);
          renderWorkspace();
          return;
        }

        openAddFormPackageIds.add(id);
        expandedPackageIds.add(id);

        renderWorkspace();
        focusAddForm(id);
      }

      function cancelAddDeliverable(packageId) {
        openAddFormPackageIds.delete(String(packageId));

        renderWorkspace();
      }

      function focusNewDeliverable(deliverableId) {
        requestAnimationFrame(() => {
          const target = Array.from(
            document.querySelectorAll("[data-deliverable-id]"),
          ).find(
            (element) =>
              element.dataset.deliverableId === String(deliverableId) &&
              element.classList.contains("deliverable-branch"),
          );

          if (!target) {
            return;
          }

          const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;

          target.scrollIntoView({
            block: "center",
            behavior: reducedMotion ? "auto" : "smooth",
          });

          window.setTimeout(() => {
            target.classList.remove("is-new");

            if (highlightDeliverableId === String(deliverableId)) {
              highlightDeliverableId = null;
            }
          }, 1800);
        });
      }

      async function submitDeliverable(packageId, form) {
        if (!form) {
          return;
        }

        clearFormErrors(form);

        const nameInput = form.querySelector('[name="deliverableName"]');

        const categoryInput = form.querySelector(
          '[name="deliverableCategory"]',
        );

        const name = nameInput.value.trim();
        const category = categoryInput.value;

        let valid = true;

        if (!name) {
          form.querySelector('[data-error-for="name"]').textContent =
            "Enter a deliverable name.";

          valid = false;
        }

        if (!category) {
          form.querySelector('[data-error-for="category"]').textContent =
            "Select a category.";

          valid = false;
        }

        if (!valid) {
          if (!name) {
            nameInput.focus();
          } else {
            categoryInput.focus();
          }

          return;
        }

        setFormSaving(form, true);
        saveInFlightCount += 1;

        try {
          const deliverable = await createDeliverable(
            packageId,
            name,
            category,
          );

          const freshData = await loadAppData();
          setAppData(freshData);

          expandedPackageIds.add(String(packageId));

          expandedDeliverableIds.add(String(deliverable.id));

          openAddFormPackageIds.delete(String(packageId));

          highlightDeliverableId = String(deliverable.id);

          renderWorkspace({
            preserveScroll: false,
          });

          focusNewDeliverable(deliverable.id);

          showToast("Deliverable added.", "success");
        } catch (error) {
          console.error("Failed to add deliverable:", error);

          if (error.partialDeliverable) {
            try {
              const freshData = await loadAppData();

              setAppData(freshData);

              expandedPackageIds.add(String(packageId));

              expandedDeliverableIds.add(String(error.partialDeliverable.id));

              openAddFormPackageIds.delete(String(packageId));

              highlightDeliverableId = String(error.partialDeliverable.id);

              renderWorkspace({
                preserveScroll: false,
              });

              focusNewDeliverable(error.partialDeliverable.id);
            } catch (refreshError) {
              console.error(
                "Could not refresh after partial deliverable creation:",
                refreshError,
              );
            }

            showToast(
              `"${name}" was created, but its category could not be saved. Update the category in monday.com or try again.`,
              "warning",
            );
          } else {
            const formError = form.querySelector("[data-form-error]");

            if (formError) {
              formError.textContent =
                "Could not add the deliverable. Try again.";
            }

            showToast("The deliverable could not be added.");
          }
        } finally {
          saveInFlightCount = Math.max(0, saveInFlightCount - 1);

          if (document.contains(form)) {
            setFormSaving(form, false);
          }
        }
      }

      async function syncFromMonday() {
        if (
          isSyncing ||
          saveInFlightCount > 0 ||
          document.visibilityState !== "visible"
        ) {
          return;
        }

        const activeElement = document.activeElement;

        if (
          activeElement &&
          ["INPUT", "SELECT", "TEXTAREA"].includes(activeElement.tagName)
        ) {
          return;
        }

        try {
          isSyncing = true;

          const freshData = await loadAppData();

          if (JSON.stringify(freshData) === JSON.stringify(appData)) {
            renderPaginationWarning();
            return;
          }

          setAppData(freshData);

          renderWorkspace();
        } catch (error) {
          console.error("Live sync failed:", error);
        } finally {
          isSyncing = false;
        }
      }

      function startLiveSync() {
        if (liveSyncStarted) {
          return;
        }

        liveSyncStarted = true;

        monday.listen("events", (response) => {
          const eventType = response.data?.type;

          if (
            eventType === "change_column_value" ||
            eventType === "change_column_values" ||
            eventType === "new_items"
          ) {
            syncFromMonday();
          }
        });

        window.setInterval(() => {
          syncFromMonday();
        }, 20000);

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            syncFromMonday();
          }
        });
      }

      function renderLoadingState() {
        const notice = document.getElementById("appNotice");

        if (notice) {
          notice.hidden = true;
        }

        document.getElementById("packages").innerHTML = `
          <div class="skeleton-row" aria-hidden="true"></div>
          <div class="skeleton-row" aria-hidden="true"></div>
          <div class="skeleton-row" aria-hidden="true"></div>
          <div class="skeleton-row" aria-hidden="true"></div>
        `;
      }

      function renderErrorState() {
        document.getElementById("packages").innerHTML = `
          <section class="state-panel">
            <h2>Could not load Design Management</h2>
            <p>
              Check the connection and try loading the board again.
            </p>

            <button
              type="button"
              class="button-primary"
              data-action="retry"
            >
              Retry
            </button>
          </section>
        `;
      }

      function setupInteractions() {
        if (interactionsStarted) {
          return;
        }

        interactionsStarted = true;

        const searchInput = document.getElementById("hierarchySearch");

        searchInput?.addEventListener("input", (event) => {
          handleSearchInput(event.target.value);
        });

        searchInput?.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            clearSearch();
            searchInput.focus();
          }
        });

        document.addEventListener("click", (event) => {
          const control = event.target.closest("[data-action]");

          if (!control) {
            return;
          }

          const action = control.dataset.action;

          switch (action) {
            case "toggle-project":
              toggleProject(control.dataset.projectId);
              break;

            case "toggle-package":
              togglePackage(
                control.dataset.projectId,
                control.dataset.packageId,
              );
              break;

            case "toggle-deliverable":
              toggleDeliverable(
                control.dataset.projectId,
                control.dataset.packageId,
                control.dataset.deliverableId,
              );
              break;

            case "toggle-all":
              toggleAll();
              break;

            case "clear-search":
              clearSearch();
              searchInput?.focus();
              break;

            case "toggle-add":
              toggleAddDeliverable(control.dataset.packageId);
              break;

            case "cancel-add":
              cancelAddDeliverable(control.dataset.packageId);
              break;

            case "retry":
              init();
              break;
          }
        });

        document.addEventListener("change", (event) => {
          const select = event.target;

          if (select.matches('[data-action="change-status-received"]')) {
            updateStatusReceived(
              select.dataset.revisionId,
              select.value,
              select.dataset.deliverableId,
              select,
            );

            return;
          }

          if (select.matches('[data-action="change-action"]')) {
            updateInternalStatus(
              select.dataset.revisionId,
              select.value,
              select.dataset.deliverableId,
              select,
            );
          }
        });

        document.addEventListener("submit", (event) => {
          const form = event.target.closest("[data-add-form]");

          if (!form) {
            return;
          }

          event.preventDefault();

          submitDeliverable(form.dataset.packageId, form);
        });

        document.addEventListener("keydown", (event) => {
          const target = event.target;

          const isEditable =
            target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement ||
            target instanceof HTMLSelectElement ||
            target?.isContentEditable;

          if (
            event.key === "/" &&
            !isEditable &&
            !event.ctrlKey &&
            !event.metaKey &&
            !event.altKey
          ) {
            event.preventDefault();
            searchInput?.focus();
            searchInput?.select();
          }
        });
      }

      async function init() {
        setupInteractions();
        renderLoadingState();

        try {
          const freshData = await loadAppData();

          setAppData(freshData);

          console.log("App Data:", appData);

          renderWorkspace({
            preserveScroll: false,
          });

          startLiveSync();
        } catch (error) {
          console.error("Error:", error);
          renderErrorState();
        }
      }

      init();
    </script>
  </body>
</html>
